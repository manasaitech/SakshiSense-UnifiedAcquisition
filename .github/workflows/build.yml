name: Build unified acquisition app

on:
  workflow_dispatch:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            os: ubuntu-latest
            configure: flutter config --enable-web
            command: flutter build web --release
            artifact: build/web
          - target: android
            os: ubuntu-latest
            configure: flutter config --enable-android
            command: flutter build apk --release
            artifact: build/app/outputs/flutter-apk/app-release.apk
          - target: windows
            os: windows-latest
            configure: flutter config --enable-windows-desktop
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release
          - target: macos
            os: macos-14
            configure: flutter config --enable-macos-desktop
            command: flutter build macos --release
            artifact: build/macos/Build/Products/Release/*.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - run: ${{ matrix.configure }}
      - run: flutter pub get
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: unified-acquisition-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
